<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DND — Chandramukhi</title>
<style>
:root{font-family:system-ui,Arial;background:#100e18;color:#f5e8d5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#43304a,#100e18 65%);min-height:100vh}main{max-width:860px;padding:28px 18px;margin:auto}.tag{color:#e7b45b;letter-spacing:.15em;text-transform:uppercase;font-size:.8rem}h1{font-family:Georgia,serif;font-size:clamp(2.1rem,7vw,4rem);margin:.3em 0}h2{font-family:Georgia,serif}p{line-height:1.6}.panel{background:#211d2be8;border:1px solid #735747;border-radius:16px;padding:22px;margin:20px 0;box-shadow:0 12px 40px #0005}.choices{display:grid;gap:12px}button{background:#a65339;color:white;border:1px solid #dca46c;border-radius:12px;padding:14px 16px;text-align:left;font-size:1rem;cursor:pointer}button:hover{background:#be6c4b}input,select{padding:12px;border-radius:10px;background:#342b3e;color:white;border:1px solid #9d846f;width:100%;margin:8px 0}.muted{color:#c7b8c5}.stats{display:flex;flex-wrap:wrap;gap:10px}.stats span{background:#3b2f41;padding:8px 12px;border-radius:30px}.hidden{display:none}
</style></head><body><main><div class="tag">Tamil Cinema • Interactive Mystery Adventure</div><h1>🏚️ DND — Chandramukhi</h1><p class="muted">A haunted mansion. Five heroes. Sixty minutes before the final door opens.</p>
<section id="setup" class="panel"><h2>Enter the Mansion</h2><label>Your name<input id="playerName" maxlength="24" placeholder="Enter your name"></label><label>Choose your role<select id="role"><option>Dr. Saravanan — The Clever Detective</option><option>Ganga — The Secret Keeper</option><option>Senthil — The Nervous Hero</option><option>Murugesan — The Comic Relief</option><option>Chandramukhi — The Mysterious Spirit</option></select></label><button id="begin">Begin Adventure →</button><p class="muted">Solo story prototype. Five-phone synchronization and TV host view are planned for a future version.</p></section>
<section id="game" class="hidden"><div class="stats"><span id="who"></span><span id="chapter"></span><span id="score"></span></div><div class="panel"><h2 id="sceneTitle"></h2><p id="story"></p><div id="choices" class="choices"></div></div><button id="restart">↻ Start Again</button></section></main>
<script>
const scenes={
gate:{title:'1. The Mansion Gates',text:'Thunder cracks above Vettaiyapuram Palace. A locked door rattles. Somewhere inside, anklets begin to ring. Your friends turn toward you. What do you do?',choices:[['Inspect the ancient lock','hall',10],['Shout “Chandramukhi!” into the darkness','echo',5],['Search for another entrance','garden',10]]},
echo:{title:'A Voice Answers',text:'A voice whispers your name. A dusty portrait falls, revealing a key. Your friends are not impressed by your shouting.',choices:[['Take the key and enter','hall',10],['Run around the palace','garden',5]]},
garden:{title:'2. The Moonlit Courtyard',text:'In the overgrown garden, a statue points toward the eastern wing. You find an old diary with a warning: “Do not open the dancer’s chamber.”',choices:[['Read the diary','diary',10],['Enter through the eastern wing','hall',5]]},
diary:{title:'The Diary',text:'The last entry tells of music played at midnight. The rhythm is the key to the locked chamber.',choices:[['Carry the diary into the mansion','hall',10]]},
hall:{title:'3. The Portrait Hall',text:'Five enormous portraits watch as the oil lamps flare. Two passageways open: one echoes with laughter, the other with classical dance bells.',choices:[['Follow the laughter','kitchen',10],['Follow the dance bells','music',15]]},
kitchen:{title:'4. The Haunted Kitchen',text:'Pots crash by themselves. A hidden note reads: “The dancer knows the truth, but the mirror holds the proof.”',choices:[['Search for the mirror','mirror',15],['Follow the bells','music',5]]},
music:{title:'5. The Dance Chamber',text:'The wooden floor trembles with a forgotten dance. You spot a mirror and a locked music box. A riddle is carved into its lid: “What follows you in light, but disappears in darkness?”',choices:[['Answer: A shadow','mirror',20],['Answer: A ghost','trap',0],['Answer: An echo','trap',0]]},
trap:{title:'A Sudden Fright',text:'The room plunges into darkness. When the lamps return, a whisper says “Try again.”',choices:[['Solve the riddle again','music',0],['Search for another clue','mirror',5]]},
mirror:{title:'6. The Mirror Reveals All',text:'The mirror hides a small chamber. Inside is the final seal, surrounded by five handprints. The mansion demands a decision: free the trapped spirit or lock the door forever.',choices:[['Break the curse and free the spirit','freedom',25],['Seal the chamber','sealed',10]]},
freedom:{title:'Finale — The Curse Is Broken',text:'The anklet music stops. Dawn reaches the courtyard. The mansion is finally at peace… or is that one last laugh behind you? You WIN!',choices:[]},
sealed:{title:'Finale — The Door Remains Shut',text:'The mansion falls silent. You escape safely, but the final lock begins to rattle again as you leave. A sequel awaits!',choices:[]}
};
let points=0;const $=id=>document.getElementById(id);
function show(id){const s=scenes[id];$('sceneTitle').textContent=s.title;$('story').textContent=s.text;$('chapter').textContent='Scene '+(id==='freedom'||id==='sealed'?'Finale':s.title.split('.')[0]);$('score').textContent='Clues: '+points;$('choices').replaceChildren();s.choices.forEach(([label,next,award])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{points+=award;show(next)};$('choices').append(b)})}
$('begin').onclick=()=>{$('who').textContent='🧭 '+($('playerName').value.trim()||'Explorer')+' | '+$('role').value.split(' — ')[0];$('setup').classList.add('hidden');$('game').classList.remove('hidden');points=0;show('gate')};$('restart').onclick=()=>{points=0;show('gate')};
</script></body></html>
